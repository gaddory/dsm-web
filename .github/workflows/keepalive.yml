name: keep-alive

# HF 무료 Space가 잠들지 않게 10분마다 health 엔드포인트를 깨운다.
# (잠들면 첫 방문자가 컨테이너 재기동을 기다려야 해서 첫 로딩이 길어짐)

on:
  schedule:
    - cron: '*/10 * * * *'   # 10분마다 (GitHub cron은 약간 지연될 수 있음)
  workflow_dispatch:          # 수동 실행 버튼

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space
        run: |
          for url in \
            "https://dory87-dsm.hf.space/api/health" ; do
            code=$(curl -s -m 40 -o /dev/null -w "%{http_code}" "$url" || echo "000")
            echo "$url -> $code"
          done
