name: build-apk

# DSM 웹앱(PWA)을 TWA(Chrome 엔진) 안드로이드 앱으로 빌드 → 서명된 APK 생성.
# Actions 탭에서 'Run workflow'로 실행하면 끝나고 Artifacts에서 APK를 받을 수 있다.
# 구글 로그인/파일 업로드/렌더 등 모든 기능이 정상 동작(TWA는 실제 Chrome으로 렌더링).

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Prepare keystore
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          PASS="${KEYSTORE_PASSWORD:-dsm-twa-2026}"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "기존 keystore(secret) 사용"
            echo "$KEYSTORE_B64" | base64 -d > android.keystore
          else
            echo "새 keystore 생성"
            keytool -genkeypair -v -keystore android.keystore -alias android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=DSM, O=DoryShortsMaker, L=Seoul, C=KR"
          fi
          echo "PASS=$PASS" >> "$GITHUB_ENV"

      - name: Generate Android project (Bubblewrap, non-interactive)
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.PASS }}
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json
          # "프로젝트 생성?" 프롬프트에 yes → 안드로이드 소스 생성(내부 gradle 실패해도 무방)
          yes | bubblewrap build --skipPwaValidation || true
          echo "--- 생성된 파일 ---"; ls -la

      - name: Build & sign with Gradle
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then echo "gradlew 없음 — 프로젝트 생성 실패"; exit 1; fi
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$PWD/android.keystore" \
            -Pandroid.injected.signing.store.password="$PASS" \
            -Pandroid.injected.signing.key.alias=android \
            -Pandroid.injected.signing.key.password="$PASS"
          echo "--- APK 찾기 ---"
          find . -name "*.apk" -path "*release*"

      - name: Collect outputs
        working-directory: android
        run: |
          mkdir -p out
          find . -name "*-release*.apk" -exec cp {} out/dsm.apk \; || true
          [ -f app-release-signed.apk ] && cp app-release-signed.apk out/dsm.apk || true
          base64 -w0 android.keystore > out/keystore.b64
          echo "===== assetlinks용 SHA256 (HF 시크릿 ASSETLINKS_SHA256) ====="
          keytool -list -v -keystore android.keystore -alias android -storepass "$PASS" | grep "SHA256:" | head -1
          ls -la out

      - name: Upload APK + keystore
        uses: actions/upload-artifact@v4
        with:
          name: dsm-apk
          path: android/out/*
          if-no-files-found: warn
