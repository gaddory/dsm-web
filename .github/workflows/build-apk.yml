name: build-apk

# DSM 웹앱(PWA)을 TWA(Chrome 엔진) 안드로이드 앱으로 직접 빌드 → 서명된 APK.
# Actions 탭에서 'Run workflow' → 완료 후 Artifacts(dsm-apk)에서 dsm.apk 다운로드.
# TWA라 실제 Chrome으로 렌더 → 구글 로그인/업로드/렌더 등 모든 기능 정상.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Gradle 8.7
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Launcher icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp frontend/public/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Prepare keystore
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          PASS="${KEYSTORE_PASSWORD:-dsm-twa-2026}"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "기존 keystore(secret) 사용"; echo "$KEYSTORE_B64" | base64 -d > android.keystore
          else
            echo "새 keystore 생성"
            keytool -genkeypair -v -keystore android.keystore -alias android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=DSM, O=DoryShortsMaker, L=Seoul, C=KR"
          fi
          echo "PASS=$PASS" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$PWD/android.keystore" \
            -Pandroid.injected.signing.store.password="$PASS" \
            -Pandroid.injected.signing.key.alias=android \
            -Pandroid.injected.signing.key.password="$PASS"

      - name: Collect outputs
        working-directory: android
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/dsm.apk
          base64 -w0 android.keystore > out/keystore.b64
          echo "===== assetlinks용 SHA256 (HF 시크릿 ASSETLINKS_SHA256) ====="
          keytool -list -v -keystore android.keystore -alias android -storepass "$PASS" | grep SHA256 | head -1
          ls -la out

      - name: Upload APK + keystore
        uses: actions/upload-artifact@v4
        with:
          name: dsm-apk
          path: android/out/*
          if-no-files-found: warn
